<header class="app-header">
  <span class="brand">Interview Prep</span>
  @if (auth.isLoggedIn()) {
    <div class="session">
      @if (auth.currentStatus(); as status) {
        <span class="status-badge" [attr.data-status]="status">{{ status }}</span>
      }
      @if (auth.currentStatus() === 'owner') {
        <a routerLink="/admin" class="admin-link">Accounts</a>
      }
      <button type="button" (click)="logout()">Log out</button>
    </div>
  }
</header>

<router-outlet />
